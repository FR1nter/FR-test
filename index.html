<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRINTER</title>
    <style>
        /* Переменные для быстрой смены темы */
        :root {
            --bg-animation-light: linear-gradient(270deg, #ffffff, #e0e0e0, #ffffff);
            --bg-animation-dark: linear-gradient(270deg, #121212, #2c2c2c, #121212);
            --text-color: #ffffff;
            --border-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.05);
            --btn-bg: #ffffff;
            --btn-text: #000000;
        }

        [data-theme="light"] {
            --text-color: #000000;
            --border-color: #000000;
            --card-bg: rgba(0, 0, 0, 0.05);
            --btn-bg: #000000;
            --btn-text: #ffffff;
        }

        /* Общие стили и плавная анимация фона */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Изменено, чтобы контент прижимался к верху */
            padding: 20px;
            box-sizing: border-box;
            background: var(--bg-animation-dark);
            background-size: 400% 400%;
            animation: gradientBg 15s ease infinite;
            transition: color 0.5s ease;
        }

        [data-theme="light"] body {
            background: var(--bg-animation-light);
            background-size: 400% 400%;
            animation: gradientBg 15s ease infinite;
        }

        @keyframes gradientBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Кнопка переключения темы */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            z-index: 10;
        }
        .theme-toggle:hover {
            background: var(--text-color);
            color: var(--btn-text);
        }

        /* Шапка: Надпись и молния в одну строку */
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px; 
            padding-top: 60px; 
            margin-bottom: 0;
        }

        .logo {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 5px;
            margin: 0;
            line-height: 1;
        }

        .lightning {
            font-size: 2.5rem;
            filter: grayscale(100%);
            line-height: 1;
        }

        /* Блок контента перенесен выше (уменьшен margin-top до 20px) */
        .content-wrapper {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px; 
            margin-bottom: 40px;
        }

        /* Основной контейнер для карточек */
        main {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 25px; /* Прежнее расстояние между рамками */
        }

        /* Стили для рамок (карточек) */
        .card {
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            background-color: var(--card-bg);
            backdrop-filter: blur(5px);
            transition: border-color 0.5s ease, background-color 0.5s ease;
        }

        .card h2 {
            margin: 0 0 15px 0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .arrow {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 15px;
        }

        /* Кнопка копирования */
        .copy-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.5s ease, color 0.5s ease;
            width: 80%;
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        .servers-list {
            font-size: 1.2rem;
            margin-top: 10px;
        }

        /* Подвал: Сохранено прежнее расстояние от рамки */
        footer {
            margin-top: 30px; 
            text-align: center;
        }

        .footer-link {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            opacity: 0.2;
            color: var(--text-color);
            text-decoration: none;
            transition: opacity 0.3s ease, color 0.5s ease;
            user-select: none;
            display: inline-block;
        }

        .footer-link:hover {
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <!-- Переключатель темы -->
    <button class="theme-toggle" id="themeToggle">Сменить тему</button>

    <!-- Верхняя часть -->
    <header>
        <div class="logo">FRINTER</div>
        <div class="lightning">⚡</div>
    </header>

    <!-- Обертка для карточек и подвала, смещенная выше -->
    <div class="content-wrapper">
        <!-- Основной контент -->
        <main>
            <!-- Первая рамка -->
            <div class="card">
                <h2>ваша подписка</h2>
                <span class="arrow">⬇</span>
                <button class="copy-btn" id="copyBtn">скопировать</button>
            </div>

            <!-- Вторая рамка -->
            <div class="card">
                <h2>сервера в подписке</h2>
                <div class="servers-list">🇫🇮 Финляндия и другие</div>
            </div>
        </main>

        <!-- Нижняя часть -->
        <footer>
            <a href="https://t.me" target="_blank" class="footer-link">FRINTER</a>
        </footer>
    </div>

    <script>
        // Логика кнопки копирования
        const copyBtn = document.getElementById('copyBtn');
        const textToCopy = "привет";

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(textToCopy).then(() => {
                copyBtn.textContent = 'скопировано';
                
                // Возвращаем текст обратно через 2 секунды
                setTimeout(() => {
                    copyBtn.textContent = 'скопировать';
                }, 2000);
            }).catch(err => {
                console.error('Ошибка при копировании: ', err);
            });
        });

        // Логика переключения тем (светлая / тёмная)
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            if (currentTheme === 'light') {
                htmlElement.removeAttribute('data-theme');
            } else {
                htmlElement.setAttribute('data-theme', 'light');
            }
        });
    </script>
</body>
</html>
