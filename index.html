<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRINTER</title>
    <style>
        /* Переменные для быстрой смены темы */
        :root {
            --bg-animation-light: linear-gradient(45deg, #ffffff, #f0f0f0, #e0e0e0, #f5f5f5, #ffffff);
            --bg-animation-dark: linear-gradient(45deg, #0a0a0a, #1a1a1a, #262626, #141414, #0a0a0a);
            --text-color: #ffffff;
            --border-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.04);
            --btn-bg: #ffffff;
            --btn-text: #000000;
        }

        [data-theme="light"] {
            --text-color: #000000;
            --border-color: #000000;
            --card-bg: rgba(0, 0, 0, 0.04);
            --btn-bg: #000000;
            --btn-text: #ffffff;
        }

        /* Общие стили и анимация фона "покрывало" */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            box-sizing: border-box;
            background: var(--bg-animation-dark);
            background-size: 600% 600%;
            animation: blanketWave 18s ease-in-out infinite;
            transition: color 0.5s ease;
            overflow-x: hidden;
        }

        [data-theme="light"] body {
            background: var(--bg-animation-light);
            background-size: 600% 600%;
            animation: blanketWave 18s ease-in-out infinite;
        }

        /* Диагональная плавная анимация перелива */
        @keyframes blanketWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Кнопка переключения темы */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            z-index: 10;
        }
        .theme-toggle:hover {
            background: var(--text-color);
            color: var(--btn-text);
        }

        /* Шапка */
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px; 
            padding-top: 60px; 
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            margin: 0;
            line-height: 1;
        }

        .lightning {
            font-size: 1.8rem;
            filter: grayscale(100%);
            line-height: 1;
        }

        /* Блок с рамкой */
        main {
            width: 100%;
            max-width: 420px;
            margin-top: 55px; 
            display: flex;
            flex-direction: column;
        }

        /* Стили для рамки с поддержкой анимации */
        .card {
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            background-color: var(--card-bg);
            backdrop-filter: blur(5px);
            transition: border-color 0.5s ease, background-color 0.5s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        /* Класс, который активируется через JS при клике на 4 секунды */
        .card.animating-border {
            animation: greyBorderGlow 4s ease-in-out;
        }

        /* Анимация перелива краев оттенками серого */
        @keyframes greyBorderGlow {
            0% { border-color: var(--border-color); }
            25% { border-color: #b3b3b3; }
            50% { border-color: #555555; }
            75% { border-color: #888888; }
            100% { border-color: var(--border-color); }
        }

        .card h2 {
            margin: 0 0 15px 0;
            font-size: 1.3rem;
            font-weight: 600;
            pointer-events: none; /* Чтобы клик проходил сквозь текст на саму рамку */
        }

        .arrow {
            font-size: 1.3rem;
            display: block;
            margin-bottom: 15px;
            pointer-events: none;
        }

        /* Кнопка копирования */
        .copy-btn {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.5s ease, color 0.5s ease;
            width: 80%;
        }

        .copy-btn:hover {
            opacity: 0.9;
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        /* Подвал: Приподнят на 20% выше за счет нижнего отступа */
        footer {
            margin-top: auto; 
            padding-top: 40px;
            padding-bottom: 20vh; /* Поднимает элемент выше над нижним краем */
            text-align: center;
        }

        .footer-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 4px;
            opacity: 0.25;
            color: var(--text-color);
            text-decoration: none;
            transition: opacity 0.3s ease, color 0.5s ease;
            user-select: none;
        }

        .footer-link:hover {
            opacity: 0.7;
        }

        .tg-icon {
            width: 22px;
            height: 22px;
            fill: #0088cc;
        }

        /* Адаптивность под ПК */
        @media (min-width: 768px) {
            header {
                padding-top: 80px;
                gap: 20px;
            }
            .logo {
                font-size: 3.5rem;
                letter-spacing: 6px;
            }
            .lightning {
                font-size: 2.8rem;
            }
            main {
                max-width: 550px;
            }
            .card {
                padding: 35px;
                border-radius: 24px;
            }
            .card h2 {
                font-size: 1.6rem;
                margin-bottom: 20px;
            }
            .arrow {
                font-size: 1.6rem;
                margin-bottom: 20px;
            }
            .copy-btn {
                padding: 14px 28px;
                font-size: 1.1rem;
                max-width: 300px;
            }
            .footer-link {
                font-size: 1.3rem;
                gap: 12px;
            }
            .tg-icon {
                width: 26px;
                height: 26px;
            }
        }
    </style>
</head>
<body>

    <!-- Переключатель темы -->
    <button class="theme-toggle" id="themeToggle">Сменить тему</button>

    <!-- Верхняя часть -->
    <header>
        <div class="logo">FRINTER</div>
        <div class="lightning">⚡</div>
    </header>

    <!-- Основной контент -->
    <main>
        <div class="card" id="mainCard">
            <h2>ваша подписка</h2>
            <span class="arrow">⬇</span>
            <button class="copy-btn" id="copyBtn">скопировать</button>
        </div>
    </main>

    <!-- Нижняя часть -->
    <footer>
        <a href="https://t.me" target="_blank" class="footer-link">
            <svg class="tg-icon" viewBox="0 0 24 24">
                <path d="M21.94 5.65c-.17-.3-.48-.5-.83-.53l-18-1.5c-.44-.04-.85.19-1.02.6-.17.41-.05.88.29 1.17l4.5 3.9c.2.17.47.24.73.18l4.47-1.03-3.12 3.93c-.15.19-.2.44-.15.68l1.5 6.5c.08.36.35.65.71.74.07.02.14.03.21.03.29 0 .57-.13.75-.36l4.2-5.4 4.14 3.03c.23.17.52.22.79.13.27-.09.48-.3.56-.57l3.5-12c.11-.38-.01-.79-.25-1.02zm-14.3 2.87l-2.48-2.15 13.04.14-10.56 2.01zm6.05 4.3l-2.07 2.61-.48-2.08 2.55-.53z"/>
            </svg>
            FRINTER
        </a>
    </footer>

    <script>
        // Анимация краев рамки при нажатии
        const mainCard = document.getElementById('mainCard');
        
        mainCard.addEventListener('click', (e) => {
            // Чтобы анимация не срабатывала повторно, если она уже идет
            if (!mainCard.classList.contains('animating-border')) {
                mainCard.classList.add('animating-border');
                
                // Удаляем класс ровно через 4 секунды (время окончания анимации)
                setTimeout(() => {
                    mainCard.classList.remove('animating-border');
                }, 4000);
            }
        });

        // Логика кнопки копирования
        const copyBtn = document.getElementById('copyBtn');
        const textToCopy = "привет";

        copyBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Предотвращает дублирование клика на саму рамку
            navigator.clipboard.writeText(textToCopy).then(() => {
                copyBtn.textContent = 'скопировано';
                setTimeout(() => {
                    copyBtn.textContent = 'скопировать';
                }, 2000);
            }).catch(err => {
                console.error('Ошибка при копировании: ', err);
            });
        });

        // Логика переключения тем
        const themeToggle = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        themeToggle.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            if (currentTheme === 'light') {
                htmlElement.removeAttribute('data-theme');
            } else {
                htmlElement.setAttribute('data-theme', 'light');
}
}); 
    </script>
</body>
</html>
